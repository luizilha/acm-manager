name: Build AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 squashfs-tools file

      - name: Syntax check
        run: |
          python3 -m py_compile acm.py acm_gui.py acm_lib/*.py gui/*.py gui/tabs/*.py

      - name: Build AppImage
        run: |
          chmod +x build_appimage.sh
          ./build_appimage.sh

      - name: Verify artifact
        run: |
          test -f acm-manager-1.1.1-x86_64.AppImage
          file acm-manager-1.1.1-x86_64.AppImage
          ls -lh acm-manager-1.1.1-x86_64.AppImage

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: acm-manager-appimage
          path: acm-manager-1.1.1-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling or tagged release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            title="AC Manager ${{ github.ref_name }}"
          else
            tag="latest"
            title="AC Manager — latest build"
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "${{ github.sha }}" \
              --title "$title" \
              --notes "Automated AppImage build from commit ${{ github.sha }}."
          fi

          gh release upload "$tag" acm-manager-1.1.1-x86_64.AppImage --clobber
          gh release edit "$tag" \
            --title "$title" \
            --notes "Automated AppImage build from commit ${{ github.sha }}." \
            --latest
